
steps:
# Run tests with coverage
- name: 'python:3.11-slim'
  id: 'run-tests'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      pip install --no-cache-dir -r requirements.txt
      pytest --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80 -v
      echo "✅ Tests passed with >80% coverage"

# Build Docker image
- name: gcr.io/cloud-builders/docker
  id: 'build-image'
  args: ["build", "-t", "gcr.io/botpproject/rag-backend:latest", "."]
  waitFor: ['run-tests']

# Push Docker image
- name: gcr.io/cloud-builders/docker
  id: 'push-image'
  args: ["push", "gcr.io/botpproject/rag-backend:latest"]
  waitFor: ['build-image']

images:
- "gcr.io/botpproject/rag-backend:latest"
