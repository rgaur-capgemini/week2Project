# Complete CI/CD Pipeline for GKE Deployment
# This pipeline builds, tests, scans, and deploys both backend and frontend to GKE

substitutions:
  _PROJECT_ID: 'botpproject'
  _REGION: 'us-central1'
  _GKE_CLUSTER: 'chatbot-rag-gke'
  _CLUSTER_ZONE: 'us-central1-a'
  _ARTIFACT_REGISTRY: 'us-central1-docker.pkg.dev/botpproject/chatbot-rag-images'
  _BACKEND_IMAGE: '${_ARTIFACT_REGISTRY}/backend'
  _FRONTEND_IMAGE: '${_ARTIFACT_REGISTRY}/frontend'

timeout: 3600s

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

steps:
  # Backend: Build → Test → Scan → Push
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args: ['build', '-t', '${_BACKEND_IMAGE}:$COMMIT_SHA', '-t', '${_BACKEND_IMAGE}:latest', '.']
    waitFor: ['-']

  - name: '${_BACKEND_IMAGE}:$COMMIT_SHA'
    id: 'test-backend'
    entrypoint: 'pytest'
    args: ['tests/', '--cov=app', '--cov-report=xml', '-v']
    env: ['ENVIRONMENT=test']
    waitFor: ['build-backend']

  - name: 'aquasec/trivy:latest'
    id: 'scan-backend'
    args: ['image', '--exit-code', '0', '--severity', 'HIGH,CRITICAL', '${_BACKEND_IMAGE}:$COMMIT_SHA']
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '--all-tags', '${_BACKEND_IMAGE}']
    waitFor: ['test-backend', 'scan-backend']

  # Frontend: Build → Scan → Push
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args: ['build', '-t', '${_FRONTEND_IMAGE}:$COMMIT_SHA', '-t', '${_FRONTEND_IMAGE}:latest', '-f', 'frontend/Dockerfile', './frontend']
    waitFor: ['-']

  - name: 'aquasec/trivy:latest'
    id: 'scan-frontend'
    args: ['image', '--exit-code', '0', '--severity', 'HIGH,CRITICAL', '${_FRONTEND_IMAGE}:$COMMIT_SHA']
    waitFor: ['build-frontend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '--all-tags', '${_FRONTEND_IMAGE}']
    waitFor: ['scan-frontend']

  # Deploy to GKE
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'get-credentials'
    args: ['container', 'clusters', 'get-credentials', '${_GKE_CLUSTER}', '--zone=${_CLUSTER_ZONE}', '--project=${_PROJECT_ID}']
    waitFor: ['push-backend', 'push-frontend']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'deploy-backend'
    args: ['set', 'image', 'deployment/rag-backend', 'rag-backend=${_BACKEND_IMAGE}:$COMMIT_SHA', '-n', 'default']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['get-credentials']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'deploy-frontend'
    args: ['set', 'image', 'deployment/rag-frontend', 'rag-frontend=${_FRONTEND_IMAGE}:$COMMIT_SHA', '-n', 'default']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['get-credentials']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'rollout-status-backend'
    args: ['rollout', 'status', 'deployment/rag-backend', '-n', 'default', '--timeout=600s']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['deploy-backend']

  - name: 'gcr.io/cloud-builders/kubectl'
    id: 'rollout-status-frontend'
    args: ['rollout', 'status', 'deployment/rag-frontend', '-n', 'default', '--timeout=600s']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['deploy-frontend']

  # Week 5: CSV Processor Cloud Function
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-csv-function'
    entrypoint: 'gcloud'
    args:
      - 'functions'
      - 'deploy'
      - 'csv-processor'
      - '--gen2'
      - '--runtime=python311'
      - '--region=${_REGION}'
      - '--source=cloud-functions/csv-processor'
      - '--entry-point=process_csv'
      - '--trigger-event-filters=type=google.cloud.storage.object.v1.finalized'
      - '--trigger-event-filters=bucket=botpproject-csv-uploads'
      - '--set-env-vars=PROJECT_ID=${_PROJECT_ID}'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--timeout=540s'
    waitFor: ['rollout-status-backend']

  # Week 5: Create GCS buckets
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'create-gcs-buckets'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gsutil ls -b gs://botpproject-csv-uploads 2>/dev/null || \
        gsutil mb -p ${_PROJECT_ID} -l ${_REGION} gs://botpproject-csv-uploads
        
        gsutil ls -b gs://botpproject-images 2>/dev/null || \
        gsutil mb -p ${_PROJECT_ID} -l ${_REGION} gs://botpproject-images
    waitFor: ['get-credentials']

  # Week 5: Smoke tests
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test-agent'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_IP=$(kubectl get svc rag-backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "Testing agent endpoint at http://$${BACKEND_IP}:8000/agent/tools"
        curl -f -m 10 http://$${BACKEND_IP}:8000/agent/tools || echo "Agent endpoint not ready yet"
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['rollout-status-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test-multimodal'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_IP=$(kubectl get svc rag-backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "Testing multimodal endpoint at http://$${BACKEND_IP}:8000/multimodal/images"
        curl -f -m 10 http://$${BACKEND_IP}:8000/multimodal/images?limit=10 || echo "Multimodal endpoint not ready yet"
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['rollout-status-backend']

  # Week 4: Verify backend route configurations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-week4-backend-routes'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Verifying Week 4 Backend Routes Configuration ==="
        
        # Check if route files exist with correct prefixes
        echo "Checking finops_routes_week4.py..."
        grep -q 'prefix="/api/finops"' app/finops_routes_week4.py && \
          echo "✓ FinOps route has /api/finops prefix" || \
          echo "✗ ERROR: FinOps route missing /api/finops prefix"
        
        echo "Checking experiment_routes_week4.py..."
        grep -q 'prefix="/api/experiments"' app/experiment_routes_week4.py && \
          echo "✓ Experiments route has /api/experiments prefix" || \
          echo "✗ ERROR: Experiments route missing /api/experiments prefix"
        
        echo "Checking observability_routes.py..."
        grep -q 'prefix="/api/observability"' app/observability_routes.py && \
          echo "✓ Observability route has /api/observability prefix" || \
          echo "✗ ERROR: Observability route missing /api/observability prefix"
        
        # Check if routes are registered in main.py
        echo "Checking main.py registrations..."
        grep -q "finops_router" app/main.py && \
          echo "✓ finops_router registered in main.py" || \
          echo "✗ ERROR: finops_router not registered"
        
        grep -q "experiment_router" app/main.py && \
          echo "✓ experiment_router registered in main.py" || \
          echo "✗ ERROR: experiment_router not registered"
        
        grep -q "observability_router" app/main.py && \
          echo "✓ observability_router registered in main.py" || \
          echo "✗ ERROR: observability_router not registered"
        
        echo "=== Backend Routes Verification Complete ==="
    waitFor: ['push-backend']

  # Week 4: Verify frontend service configurations
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-week4-frontend-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Verifying Week 4 Frontend Services Configuration ==="
        
        # Check frontend service base URLs
        echo "Checking finops.service.ts..."
        grep -q 'baseUrl.*api/finops' frontend/src/app/services/finops.service.ts && \
          echo "✓ FinOps service uses /api/finops" || \
          echo "✗ ERROR: FinOps service missing /api/finops"
        
        echo "Checking experiments.service.ts..."
        grep -q 'baseUrl.*api/experiments' frontend/src/app/services/experiments.service.ts && \
          echo "✓ Experiments service uses /api/experiments" || \
          echo "✗ ERROR: Experiments service missing /api/experiments"
        
        echo "Checking observability.service.ts..."
        grep -q 'baseUrl.*api/observability' frontend/src/app/services/observability.service.ts && \
          echo "✓ Observability service uses /api/observability" || \
          echo "✗ ERROR: Observability service missing /api/observability"
        
        # Check Angular routing
        echo "Checking app-routing.module.ts..."
        grep -q "path: 'finops'" frontend/src/app/app-routing.module.ts && \
          echo "✓ FinOps route configured" || \
          echo "✗ ERROR: FinOps route not configured"
        
        grep -q "path: 'experiments'" frontend/src/app/app-routing.module.ts && \
          echo "✓ Experiments route configured" || \
          echo "✗ ERROR: Experiments route not configured"
        
        grep -q "path: 'observability'" frontend/src/app/app-routing.module.ts && \
          echo "✓ Observability route configured" || \
          echo "✗ ERROR: Observability route not configured"
        
        # Check nginx proxy configuration
        echo "Checking nginx.conf..."
        grep -q 'location /api/' frontend/nginx.conf && \
          echo "✓ Nginx has /api/ proxy location" || \
          echo "✗ ERROR: Nginx missing /api/ proxy location"
        
        echo "=== Frontend Services Verification Complete ==="
    waitFor: ['push-frontend']

  # Week 4: Smoke test the deployed endpoints
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'smoke-test-week4-apis'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "=== Testing Week 4 API Endpoints ==="
        BACKEND_IP=$(kubectl get svc rag-backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        
        echo "Testing FinOps API at http://$${BACKEND_IP}/api/finops/costs/current-month"
        curl -f -m 10 -H "Authorization: Bearer test-token" http://$${BACKEND_IP}/api/finops/costs/current-month || \
          echo "⚠ FinOps API not ready (may need authentication)"
        
        echo "Testing Experiments API at http://$${BACKEND_IP}/api/experiments/variants"
        curl -f -m 10 -H "Authorization: Bearer test-token" http://$${BACKEND_IP}/api/experiments/variants || \
          echo "⚠ Experiments API not ready (may need authentication)"
        
        echo "Testing Observability API at http://$${BACKEND_IP}/api/observability/slos"
        curl -f -m 10 -H "Authorization: Bearer test-token" http://$${BACKEND_IP}/api/observability/slos || \
          echo "⚠ Observability API not ready (may need authentication)"
        
        echo "=== Week 4 API Smoke Tests Complete ==="
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_CLUSTER_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_GKE_CLUSTER}'
    waitFor: ['rollout-status-backend', 'rollout-status-frontend']

images:
  - '${_BACKEND_IMAGE}:$COMMIT_SHA'
  - '${_BACKEND_IMAGE}:latest'
  - '${_FRONTEND_IMAGE}:$COMMIT_SHA'
  - '${_FRONTEND_IMAGE}:latest'

tags: ['gke-deployment', 'chatbot-rag', '$COMMIT_SHA']
