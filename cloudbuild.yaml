# ──────────────────────────────────────────────────────────────────────────────
# CD Pipeline — master branch
#
# Triggered on: push / merge to `master`
# Purpose: Full build + test + deploy to Cloud Run (production)
#
# Stages:
#   1. test        – pytest unit tests (≥80% coverage required)
#   2. lint        – flake8 code style check
#   3. build-back  – docker build backend image
#   4. build-front – docker build & npm build frontend image
#   5. push        – push both images to Artifact Registry
#   6. deploy      – Cloud Run deploy (backend + frontend)
#   7. smoke       – health-check against live Cloud Run URL
#   8. notify      – log build summary
#
# Admin:   raman.gaur@capgemini.com  (ADMIN role)
# Account: gaurraman00@gmail.com     (GCP Owner)
# ──────────────────────────────────────────────────────────────────────────────

substitutions:
  _PROJECT_ID:     "botpproject"
  _REGION:         "us-central1"
  _REGISTRY:       "us-central1-docker.pkg.dev/botpproject/rag-service"
  _BACKEND_SVC:    "rag-service"
  _FRONTEND_SVC:   "rag-frontend"
  _SA_EMAIL:       "rag-service@botpproject.iam.gserviceaccount.com"
  _ADMIN_EMAILS:   "raman.gaur@capgemini.com"
  _MEMORY:         "4Gi"
  _CPU:            "2"
  _MIN_INSTANCES:  "1"
  _MAX_INSTANCES:  "10"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

timeout: "2400s"  # 40 minutes

steps:

  # ── 1. Unit tests (must pass ≥80% coverage) ───────────────────────────────
  - id: "run-tests"
    name: "python:3.11-slim"
    entrypoint: bash
    env:
      - "PROJECT_ID=$_PROJECT_ID"
      - "ENVIRONMENT=test"
      - "PYTHONPATH=/workspace"
    args:
      - "-c"
      - |
        set -e
        echo "=========================================="
        echo "🧪 [master] Running unit tests"
        echo "Commit: $COMMIT_SHA  Branch: master"
        echo "=========================================="
        pip install --upgrade pip --quiet
        pip install -r requirements.txt --quiet
        pip install pytest pytest-cov pytest-asyncio pytest-mock --quiet

        pytest tests/unit \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --tb=short \
          -v \
          --junitxml=/workspace/test-results/junit.xml

        echo "✅ Tests passed with ≥80% coverage"
    waitFor: ["-"]

  # ── 2. Lint ────────────────────────────────────────────────────────────────
  - id: "lint"
    name: "python:3.11-slim"
    entrypoint: bash
    args:
      - "-c"
      - |
        pip install flake8 --quiet
        echo "=========================================="
        echo "🔍 [master] Running flake8 lint"
        echo "=========================================="
        flake8 app/ \
          --max-line-length=120 \
          --exclude=__pycache__,.git,*.pyc \
          --per-file-ignores="__init__.py:F401" \
          --count --statistics
        echo "✅ Lint passed"
    waitFor: ["-"]

  # ── 3. Build backend Docker image ─────────────────────────────────────────
  - id: "build-backend"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY}/rag-service:$SHORT_SHA"
      - "-t"
      - "${_REGISTRY}/rag-service:latest"
      - "-f"
      - "Dockerfile"
      - "."
    waitFor: ["run-tests", "lint"]

  # ── 4. Build frontend Docker image ────────────────────────────────────────
  - id: "build-frontend"
    name: "node:20"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        echo "=========================================="
        echo "🏗️  Building Angular frontend"
        echo "=========================================="
        cd frontend
        npm install --quiet
        npm run build:prod 2>/dev/null || npm run build -- --configuration=production || npm run build
        echo "✅ Frontend build complete"
    waitFor: ["run-tests", "lint"]

  - id: "build-frontend-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY}/rag-frontend:$SHORT_SHA"
      - "-t"
      - "${_REGISTRY}/rag-frontend:latest"
      - "-f"
      - "frontend/Dockerfile"
      - "./frontend"
    waitFor: ["build-frontend"]

  # ── 5. Authenticate Docker + Push images ──────────────────────────────────
  - id: "docker-auth"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "auth"
      - "configure-docker"
      - "us-central1-docker.pkg.dev"
      - "--quiet"
    waitFor: ["build-backend", "build-frontend-image"]

  - id: "push-backend"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_REGISTRY}/rag-service"]
    waitFor: ["docker-auth"]

  - id: "push-frontend"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_REGISTRY}/rag-frontend"]
    waitFor: ["docker-auth"]

  # ── 6a. Deploy backend to Cloud Run ───────────────────────────────────────
  - id: "deploy-backend"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "${_BACKEND_SVC}"
      - "--image=${_REGISTRY}/rag-service:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--project=${_PROJECT_ID}"
      - "--platform=managed"
      - "--service-account=${_SA_EMAIL}"
      - "--memory=${_MEMORY}"
      - "--cpu=${_CPU}"
      - "--min-instances=${_MIN_INSTANCES}"
      - "--max-instances=${_MAX_INSTANCES}"
      - "--port=8080"
      - "--allow-unauthenticated"
      - "--set-env-vars=PROJECT_ID=${_PROJECT_ID}"
      - "--set-env-vars=REGION=${_REGION}"
      - "--set-env-vars=ENVIRONMENT=production"
      - "--set-env-vars=ADMIN_EMAILS=${_ADMIN_EMAILS}"
      - "--set-env-vars=VERTEX_INDEX_ID=5347067982386298880"
      - "--set-env-vars=VERTEX_INDEX_ENDPOINT=332186652006940672"
      - "--set-env-vars=DEPLOYED_INDEX_ID=rag_chatbot_deployed"
      - "--set-env-vars=GCS_BUCKET=botpproject-rag-documents"
      - "--set-env-vars=GCS_CSV_BUCKET=botpproject-csv-data"
      - "--set-env-vars=REDIS_HOST=10.200.18.59"
      - "--set-env-vars=REDIS_PORT=6379"
      - "--set-env-vars=PROJECT_NUMBER=430569389330"
      - "--set-secrets=GOOGLE_CLIENT_ID=google-oauth-client-id:latest"
      - "--set-secrets=JWT_SECRET_KEY=chatbot-jwt-secret:latest"
      - "--set-secrets=GOOGLE_CLIENT_SECRET=google-oauth-client-secret:latest"
    waitFor: ["push-backend"]

  # ── 6b. Deploy frontend to Cloud Run ──────────────────────────────────────
  - id: "deploy-frontend"
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "${_FRONTEND_SVC}"
      - "--image=${_REGISTRY}/rag-frontend:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--project=${_PROJECT_ID}"
      - "--platform=managed"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--port=80"
      - "--allow-unauthenticated"
    waitFor: ["push-frontend"]

  # ── 7. Smoke test — hit /health on live backend ───────────────────────────
  - id: "smoke-test"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        echo "=========================================="
        echo "🔥 Smoke test — verifying live endpoints"
        echo "=========================================="

        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SVC} \
          --region=${_REGION} --project=${_PROJECT_ID} \
          --format='value(status.url)')

        echo "Backend URL: $$BACKEND_URL"

        # Retry up to 5 times (Cloud Run cold-start)
        for i in 1 2 3 4 5; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$$BACKEND_URL/health")
          if [ "$$HTTP_CODE" = "200" ]; then
            echo "✅ /health returned 200 — backend is live"
            break
          fi
          echo "Attempt $$i: /health returned $$HTTP_CODE — retrying in 10s..."
          sleep 10
        done

        if [ "$$HTTP_CODE" != "200" ]; then
          echo "❌ Smoke test failed — /health did not return 200 after 5 attempts"
          exit 1
        fi
    waitFor: ["deploy-backend"]

  # ── 8. Build summary ──────────────────────────────────────────────────────
  - id: "notify"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: bash
    args:
      - "-c"
      - |
        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SVC} \
          --region=${_REGION} --project=${_PROJECT_ID} \
          --format='value(status.url)') 2>/dev/null || BACKEND_URL="N/A"
        FRONTEND_URL=$(gcloud run services describe ${_FRONTEND_SVC} \
          --region=${_REGION} --project=${_PROJECT_ID} \
          --format='value(status.url)') 2>/dev/null || FRONTEND_URL="N/A"

        echo "=========================================="
        echo "🚀 DEPLOYMENT SUCCESSFUL"
        echo "=========================================="
        echo "  Build ID  : $BUILD_ID"
        echo "  Commit    : $COMMIT_SHA"
        echo "  Branch    : master"
        echo "  Project   : ${_PROJECT_ID}"
        echo "  Backend   : $$BACKEND_URL"
        echo "  Frontend  : $$FRONTEND_URL"
        echo "  Admin     : ${_ADMIN_EMAILS}"
        echo "  Images    :"
        echo "    ${_REGISTRY}/rag-service:$SHORT_SHA"
        echo "    ${_REGISTRY}/rag-frontend:$SHORT_SHA"
        echo "=========================================="
    waitFor: ["smoke-test", "deploy-frontend"]

images:
  - "${_REGISTRY}/rag-service:$SHORT_SHA"
  - "${_REGISTRY}/rag-service:latest"
  - "${_REGISTRY}/rag-frontend:$SHORT_SHA"
  - "${_REGISTRY}/rag-frontend:latest"

tags: ["master", "production", "cd"]
